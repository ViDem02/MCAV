[project]
name = "mcav-project"
version = "0.1.0"
description = "Geometric cascade control of a quadrotor in MuJoCo, with symbolically verified stability analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "mujoco>=3.9.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
]
[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
